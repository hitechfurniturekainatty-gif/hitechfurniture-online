name: Backup restore test

# Proves the nightly backup can really be restored. Downloads the newest encrypted dump
# from Hostinger, decrypts it, restores it into a throw-away Postgres inside this job
# (never the live database) and prints row counts of the main tables.
# Runs on the 1st of every month and on demand. Nothing is kept: the job's database and
# files are deleted when the job ends. Only counts are printed — no customer data.

on:
  schedule:
    - cron: "0 4 1 * *" # 1st of each month, 9:30 AM India
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restoretest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: restoretest
      BACKUP_DIR: db
    steps:
      - name: Install PostgreSQL 17 client and lftp
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 lftp >/dev/null

      - name: Download newest backup from Hostinger
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          set -euo pipefail
          export LFTP_PASSWORD="$PASS"
          lftp_cmd() { lftp -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 30; $1; bye" --env-password -u "$USER" "ftp://$HOST"; }
          NEWEST=$(lftp_cmd "cls -1 --sort=name $BACKUP_DIR/hitech-db-*.dump.gpg" | sort | tail -n 1)
          [ -n "$NEWEST" ] || { echo "No backup file found"; exit 1; }
          echo "Newest backup: $NEWEST"
          lftp_cmd "get $NEWEST -o $RUNNER_TEMP/backup.dump.gpg"
          echo "NEWEST=$NEWEST" >> "$GITHUB_ENV"

      - name: Decrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "$RUNNER_TEMP/backup.dump" "$RUNNER_TEMP/backup.dump.gpg" 3<<<"$BACKUP_PASSPHRASE"
          rm -f "$RUNNER_TEMP/backup.dump.gpg"
          /usr/lib/postgresql/17/bin/pg_restore --list "$RUNNER_TEMP/backup.dump" | grep -c "TABLE DATA" | xargs echo "Tables with data in backup:"

      - name: Restore into throw-away database
        run: |
          set -uo pipefail
          # Supabase roles/extensions the dump refers to, so objects restore cleanly.
          psql -q -d postgres <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin bypassrls; end if;
            if not exists (select 1 from pg_roles where rolname='supabase_admin') then create role supabase_admin nologin; end if;
            if not exists (select 1 from pg_roles where rolname='supabase_auth_admin') then create role supabase_auth_admin nologin; end if;
            if not exists (select 1 from pg_roles where rolname='supabase_storage_admin') then create role supabase_storage_admin nologin; end if;
          end $$;
          create extension if not exists pgcrypto;
          create extension if not exists "uuid-ossp";
          SQL
          # pg_restore exits non-zero for harmless Supabase-only items (missing platform roles,
          # extensions, "schema public already exists"). The data check in the next step decides
          # pass/fail, so do not stop here; just show a summary of what it complained about.
          rc=0
          /usr/lib/postgresql/17/bin/pg_restore -d postgres --no-owner --no-privileges "$RUNNER_TEMP/backup.dump" 2> "$RUNNER_TEMP/restore.err" || rc=$?
          echo "pg_restore finished (exit $rc). Warnings: $(grep -c 'ERROR' "$RUNNER_TEMP/restore.err" || true)"
          grep -o 'ERROR: .*' "$RUNNER_TEMP/restore.err" | cut -c1-140 | sort | uniq -c | sort -rn | head -20 || true

      - name: Check restored data (counts only)
        run: |
          set -euo pipefail
          psql -d postgres -At -F ' | ' <<'SQL' | tee "$RUNNER_TEMP/counts.txt"
          select 'sales_leads', count(*) from public.sales_leads
          union all select 'sales_lead_followups', count(*) from public.sales_lead_followups
          union all select 'quotations', count(*) from public.quotations
          union all select 'quotation_items', count(*) from public.quotation_items
          union all select 'products', count(*) from public.products
          union all select 'main_categories', count(*) from public.main_categories
          union all select 'customer_complaints', count(*) from public.customer_complaints
          union all select 'receivables', count(*) from public.receivables
          union all select 'profiles (staff)', count(*) from public.profiles
          union all select 'auth.users (logins)', count(*) from auth.users
          union all select 'newest lead', coalesce(max(created_at)::text,'-') from public.sales_leads
          union all select 'newest quotation', coalesce(max(created_at)::text,'-') from public.quotations;
          SQL
          LEADS=$(psql -d postgres -At -c "select count(*) from public.sales_leads")
          QUOTES=$(psql -d postgres -At -c "select count(*) from public.quotations")
          PRODUCTS=$(psql -d postgres -At -c "select count(*) from public.products")
          [ "$LEADS" -gt 0 ] && [ "$QUOTES" -gt 0 ] && [ "$PRODUCTS" -gt 0 ] || { echo "RESTORE TEST FAILED: key tables are empty"; exit 1; }
          echo "RESTORE TEST PASSED from $NEWEST"
          rm -f "$RUNNER_TEMP/backup.dump"
