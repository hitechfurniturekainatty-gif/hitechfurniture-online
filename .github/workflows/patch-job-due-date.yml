name: Patch Job Due Date UI

on:
  push:
    paths:
      - '.github/job-due-date-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch assignment and worker deadline UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/admin/AdminQuotationEditor.tsx')
          s = p.read_text()
          replacements = [
            (
              '  const [jobNotes, setJobNotes] = useState("");\n  const [generatingJob, setGeneratingJob] = useState(false);',
              '  const [jobNotes, setJobNotes] = useState("");\n  const [jobDueDate, setJobDueDate] = useState("");\n  const [generatingJob, setGeneratingJob] = useState(false);'
            ),
            (
              '    setJobNotes("");\n    setJobMode("saved");\n    setJobOpen(true);',
              '    setJobNotes("");\n    if (q?.expected_delivery_date) {\n      const [y, m, d] = q.expected_delivery_date.split("-").map(Number);\n      const due = new Date(Date.UTC(y, m - 1, d));\n      due.setUTCDate(due.getUTCDate() - 1);\n      setJobDueDate(due.toISOString().slice(0, 10));\n    } else {\n      setJobDueDate("");\n    }\n    setJobMode("saved");\n    setJobOpen(true);'
            ),
            (
              '          notes: jobNotes || null,\n          created_by: user?.id ?? null,',
              '          notes: jobNotes || null,\n          due_at: jobDueDate ? new Date(`${jobDueDate}T18:00:00+05:30`).toISOString() : null,\n          created_by: user?.id ?? null,'
            ),
            (
              '            <div className="space-y-1.5"><Label>Notes (optional)</Label><Textarea rows={2} value={jobNotes} onChange={(e) => setJobNotes(e.target.value)} placeholder="e.g. priority, finish type..." /></div>',
              '            <div className="space-y-1.5">\n              <Label>Job deadline / Due date</Label>\n              <Input type="date" value={jobDueDate} onChange={(e) => setJobDueDate(e.target.value)} />\n              <p className="text-[11px] text-muted-foreground">Auto: one day before quotation delivery date. You can change it before assigning.</p>\n            </div>\n            <div className="space-y-1.5"><Label>Notes (optional)</Label><Textarea rows={2} value={jobNotes} onChange={(e) => setJobNotes(e.target.value)} placeholder="e.g. priority, finish type..." /></div>'
            ),
            (
              '      const msg = `${greeting}\\n\\nNew job work assigned. Reference: ${q.quotation_id}\\nItems: ${chosenItems.length}\\n\\n— Hitech Furniture & Interiors`;',
              '      const dueLine = jobDueDate ? `\\nDeadline: ${new Date(`${jobDueDate}T12:00:00`).toLocaleDateString("en-IN")}` : "";\n      const msg = `${greeting}\\n\\nNew job work assigned. Reference: ${q.quotation_id}\\nItems: ${chosenItems.length}${dueLine}\\n\\n— Hitech Furniture & Interiors`;'
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'AdminQuotationEditor patch target not found: {old[:80]}')
            s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/pages/WorkerPortal.tsx')
          s = p.read_text()
          replacements = [
            ('  is_urgent: boolean;\n  quotation_code: string;', '  is_urgent: boolean;\n  due_at: string | null;\n  quotation_code: string;'),
            ('.select("id, status, notes, item_ids, quotation_id, created_at, status_updated_at, is_urgent, quotations!inner(quotation_id, party_place, document_type)")', '.select("id, status, notes, item_ids, quotation_id, created_at, status_updated_at, is_urgent, due_at, quotations!inner(quotation_id, party_place, document_type)")'),
            ('      is_urgent: row.is_urgent,\n      quotation_code:', '      is_urgent: row.is_urgent,\n      due_at: row.due_at ?? null,\n      quotation_code:'),
            ('                      <p className="mt-0.5 flex items-center gap-1 text-xs text-muted-foreground">\n                        <Clock className="h-3 w-3" /> Updated {fmtDateTime(job.status_updated_at)}\n                      </p>', '                      {job.due_at && (\n                        <p className="mt-1 flex items-center gap-1 text-xs font-semibold text-destructive">\n                          <Clock className="h-3 w-3" /> Deadline {new Date(job.due_at).toLocaleDateString("en-IN")}\n                        </p>\n                      )}\n                      <p className="mt-0.5 flex items-center gap-1 text-xs text-muted-foreground">\n                        <Clock className="h-3 w-3" /> Updated {fmtDateTime(job.status_updated_at)}\n                      </p>')
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'WorkerPortal patch target not found: {old[:80]}')
            s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/pages/WorkerJobView.tsx')
          s = p.read_text()
          replacements = [
            ('  created_at: string;\n  item_ids: string[];', '  created_at: string;\n  due_at: string | null;\n  item_ids: string[];'),
            ('.select("id, status, notes, is_urgent, created_at, item_ids, quotations!inner(quotation_id, party_place)")', '.select("id, status, notes, is_urgent, created_at, due_at, item_ids, quotations!inner(quotation_id, party_place)")'),
            ('      created_at: jw.created_at,\n      item_ids:', '      created_at: jw.created_at,\n      due_at: jw.due_at ?? null,\n      item_ids:'),
            ('        {job.notes && (', '        {job.due_at && (\n          <div className="rounded-lg border border-destructive/30 bg-destructive/5 p-3 text-sm">\n            <p className="text-xs font-semibold uppercase tracking-wide text-destructive">Complete before</p>\n            <p className="mt-1 text-base font-bold">{new Date(job.due_at).toLocaleDateString("en-IN")}</p>\n          </div>\n        )}\n\n        {job.notes && (')
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'WorkerJobView patch target not found: {old[:80]}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminQuotationEditor.tsx src/pages/WorkerPortal.tsx src/pages/WorkerJobView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add automatic editable job deadlines"
          git push origin HEAD:main
