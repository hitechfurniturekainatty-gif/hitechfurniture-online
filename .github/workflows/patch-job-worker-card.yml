name: Patch Worker Job Card

on:
  push:
    paths:
      - '.github/worker-job-card-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch assign job and worker PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/admin/AdminQuotationEditor.tsx')
          s = p.read_text()
          reps = [
            (
              '      const pdfBlob = await generateJobWorkPdf({\n        quotation_id: q.quotation_id,\n        worker_name: worker?.name ?? "Job Work",\n        date: new Date().toLocaleDateString("en-IN"),\n        notes: jobNotes || null,',
              '      const pdfBlob = await generateJobWorkPdf({\n        quotation_id: q.quotation_id,\n        customer_name: q.party_name,\n        customer_place: q.party_place,\n        worker_name: worker?.name ?? "Job Work",\n        date: new Date().toLocaleDateString("en-IN"),\n        required_by: jobDueDate ? new Date(`${jobDueDate}T12:00:00`).toLocaleDateString("en-IN") : null,\n        notes: jobNotes || null,'
            ),
            (
              '      const dueLine = jobDueDate ? `\\nDeadline: ${new Date(`${jobDueDate}T12:00:00`).toLocaleDateString("en-IN")}` : "";\n      const msg = `${greeting}\\n\\nNew job work assigned. Reference: ${q.quotation_id}\\nItems: ${chosenItems.length}${dueLine}\\n\\n— Hitech Furniture & Interiors`;',
              '      const dueLine = jobDueDate ? `\\nRequired by: ${new Date(`${jobDueDate}T12:00:00`).toLocaleDateString("en-IN")}` : "";\n      const noteLine = jobNotes.trim() ? `\\nNote: ${jobNotes.trim()}` : "";\n      const msg = `${greeting}\\n\\nNew job work assigned.\\nCustomer: ${q.party_name}\\nPlace: ${q.party_place}\\nQuotation: ${q.quotation_id}\\nItems: ${chosenItems.length}${dueLine}${noteLine}\\n\\n— Hitech Furniture & Interiors`;'
            ),
            (
              '            <p className="text-sm text-muted-foreground">{selectedItemIds.size} item(s) selected. Worker image will exclude prices, GST and customer phone.</p>',
              '            <div className="rounded-lg border bg-muted/30 p-3">\n              <p className="text-sm font-semibold text-foreground">{q.party_name}</p>\n              <p className="text-xs text-muted-foreground">{q.party_place} · {q.quotation_id}</p>\n              <p className="mt-1 text-[11px] font-medium text-emerald-700 dark:text-emerald-400">Worker copy: customer phone is never included.</p>\n            </div>\n            <p className="text-sm text-muted-foreground">{selectedItemIds.size} item(s) selected. Worker image will exclude prices, GST and customer phone.</p>'
            ),
            (
              '<Label>Job deadline / Due date</Label>\n              <Input type="date" value={jobDueDate} onChange={(e) => setJobDueDate(e.target.value)} />\n              <p className="text-[11px] text-muted-foreground">Auto: one day before quotation delivery date. You can change it before assigning.</p>',
              '<Label>Required by / Delivery date for worker</Label>\n              <Input type="date" value={jobDueDate} onChange={(e) => setJobDueDate(e.target.value)} />\n              <p className="text-[11px] text-muted-foreground">Choose the date this worker must finish/hand over the selected items. It defaults to one day before the customer delivery date, but you can set any earlier date.</p>'
            ),
            (
              '<div className="space-y-1.5"><Label>Notes (optional)</Label><Textarea rows={2} value={jobNotes} onChange={(e) => setJobNotes(e.target.value)} placeholder="e.g. priority, finish type..." /></div>',
              '<div className="space-y-1.5"><Label>Narration / Instructions (optional)</Label><Textarea rows={2} value={jobNotes} onChange={(e) => setJobNotes(e.target.value)} placeholder="e.g. finish before evening, polish type, special instruction..." /></div>'
            ),
          ]
          for old, new in reps:
            if old not in s:
              raise SystemExit('AdminQuotationEditor target not found: ' + old[:120])
            s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/lib/quotationPdf.tsx')
          s = p.read_text()
          reps = [
            (
              'export type JobWorkPdfData = {\n  quotation_id: string;\n  worker_name: string;\n  date: string;\n  notes: string | null;',
              'export type JobWorkPdfData = {\n  quotation_id: string;\n  customer_name: string;\n  customer_place: string;\n  worker_name: string;\n  date: string;\n  required_by: string | null;\n  notes: string | null;'
            ),
            (
              '      <View style={jwStyles.metaStrip}>\n        <View style={jwStyles.metaCell}>\n          <Text style={jwStyles.metaLabel}>Reference</Text>\n          <Text style={jwStyles.metaValue}>{d.quotation_id}</Text>\n        </View>\n        <View style={jwStyles.metaCellLast}>\n          <Text style={jwStyles.metaLabel}>Date</Text>\n          <Text style={jwStyles.metaValue}>{d.date}</Text>\n        </View>\n      </View>',
              '      <View style={jwStyles.metaStrip}>\n        <View style={jwStyles.metaCell}>\n          <Text style={jwStyles.metaLabel}>Customer</Text>\n          <Text style={jwStyles.metaValue}>{d.customer_name}</Text>\n          <Text style={[jwStyles.metaLabel, { marginTop: 5 }]}>Place</Text>\n          <Text style={jwStyles.metaValue}>{d.customer_place}</Text>\n        </View>\n        <View style={jwStyles.metaCell}>\n          <Text style={jwStyles.metaLabel}>Quotation</Text>\n          <Text style={jwStyles.metaValue}>{d.quotation_id}</Text>\n          <Text style={[jwStyles.metaLabel, { marginTop: 5 }]}>Assigned Date</Text>\n          <Text style={jwStyles.metaValue}>{d.date}</Text>\n        </View>\n        <View style={jwStyles.metaCellLast}>\n          <Text style={jwStyles.metaLabel}>Required By</Text>\n          <Text style={jwStyles.metaValue}>{d.required_by || "-"}</Text>\n          <Text style={[jwStyles.metaLabel, { marginTop: 5 }]}>Worker</Text>\n          <Text style={jwStyles.metaValue}>{d.worker_name}</Text>\n        </View>\n      </View>'
            ),
          ]
          for old, new in reps:
            if old not in s:
              raise SystemExit('quotationPdf target not found: ' + old[:120])
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/AdminQuotationEditor.tsx src/lib/quotationPdf.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: show customer and required date on worker jobs"
          git push origin HEAD:main
